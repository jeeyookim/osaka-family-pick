<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Osaka Family Pick</title>
<meta name="description" content="오사카 가족 여행 · 가고 싶은 곳에 1~5점을 주면 가족 구글 시트에 바로 저장돼요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: Dotonbori signboard — paper ground, ink type, vermilion for "꼭 가요".
   Phone: one column, photo first, rating right under the name.
   Desktop (≥980px): big photo stage + thumbnail rail on the left, details and the 1–5 rating on the right. */
:root{
  --paper:#F6F2EA; --card:#FFFFFF; --ink:#1C1A22; --muted:#6C6776; --line:#E3DDD2;
  --accent:#E0412B; --accent-ink:#FFFFFF; --hi:#F2B705; --good:#1F8A5B; --skip:#8A8494;
  --r1:#8A8494; --r2:#A98F6B; --r3:#E0A800; --r4:#EC7A2C; --r5:#E0412B; --r-ink:#FFFFFF; --r3-ink:#1C1A22;
  --shade:rgba(20,16,24,.62);
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141218; --card:#1E1B24; --ink:#F2EEE6; --muted:#A49EAE; --line:#2E2A36;
    --accent:#FF5A43; --accent-ink:#1A0F0C; --hi:#F5C431; --good:#3CC48A; --skip:#8E879A;
    --r1:#77707F; --r2:#9C8462; --r3:#E8B21A; --r4:#F08A3E; --r5:#FF5A43; --r-ink:#141218; --r3-ink:#141218;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141218; --card:#1E1B24; --ink:#F2EEE6; --muted:#A49EAE; --line:#2E2A36;
  --accent:#FF5A43; --accent-ink:#1A0F0C; --hi:#F5C431; --good:#3CC48A; --skip:#8E879A;
  --r1:#77707F; --r2:#9C8462; --r3:#E8B21A; --r4:#F08A3E; --r5:#FF5A43; --r-ink:#141218; --r3-ink:#141218;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body)}
body{min-height:100%;font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
a{color:inherit}
img{max-width:100%}
.wrap{max-width:1320px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header.top{display:grid;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,42px);line-height:1;margin:0;letter-spacing:.5px}
.brand h1 b{color:var(--accent);font-weight:400}
.brand .sub{color:var(--muted);font-size:13.5px}
.status{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.status .dot{transform:translateY(-1px)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--skip);display:inline-block;flex:none}
.dot.on{background:var(--good)}
.who{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}
nav.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.tabs a{text-decoration:none;padding:10px 14px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.panel{display:grid;gap:14px;min-width:0;grid-template-columns:minmax(0,1fr)}
.wrap{grid-template-columns:minmax(0,1fr)}
.hint{color:var(--muted);font-size:14px;margin:0}
.toolbar{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--card);padding:7px 13px;border-radius:10px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.prog-line{display:flex;align-items:center;gap:10px;min-width:220px;flex:1;max-width:420px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--line);border-radius:7px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:none;border-radius:12px;padding:11px 16px;font-weight:900;font-size:15px;background:var(--ink);color:var(--paper);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;border-radius:6px;padding:3px 8px;background:var(--paper);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.tag.easy{border-color:var(--good);color:var(--good)}
.tag.hard{border-color:var(--accent);color:var(--accent)}

/* ---- one place: gallery + info ---- */
.place{display:grid;gap:14px;min-width:0;grid-template-columns:minmax(0,1fr)}
.gal-col,.info-col{min-width:0;display:grid;gap:12px;align-content:start;grid-template-columns:minmax(0,1fr)}
.gal{min-width:0}
.stage{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:14px;overflow:hidden;background:var(--line)}
@media (min-width:600px){.stage{aspect-ratio:16/10}}
.strip{display:flex;width:100%;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.strip::-webkit-scrollbar{display:none}
.strip img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;scroll-snap-stop:always;background:var(--line);cursor:zoom-in;display:block}
.stage .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:none;background:var(--shade);color:#fff;font-size:28px;line-height:1;display:grid;place-items:center}
.stage .nav.prev{left:10px}.stage .nav.next{right:10px}
.stage .nav:hover{background:rgba(20,16,24,.82)}
.stage .buzz{position:absolute;left:10px;top:10px;background:var(--hi);color:#1C1A22;font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px}
.stage .count{position:absolute;right:10px;top:10px;background:var(--shade);color:#fff;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.stage .zoom{position:absolute;right:10px;bottom:10px;background:var(--shade);color:#fff;border:none;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px}
.cap{font-size:13px;color:var(--muted);margin:0;min-height:1.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap a{color:var(--ink);font-weight:700}
.rail{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.rail button{flex:0 0 84px;aspect-ratio:16/10;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--line);opacity:.62;transition:opacity .15s}
.rail button:hover{opacity:.9}
.rail button.on{opacity:1;border-color:var(--accent)}
.rail img{width:100%;height:100%;object-fit:cover;display:block}
.ph-head{display:grid;gap:2px}
.crumb{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.ph-head h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.2vw,36px);line-height:1.12;margin:0;text-wrap:balance}
.ph-head .en{color:var(--muted);font-size:14px}
.desc{margin:0;font-size:15.5px;line-height:1.6;max-width:62ch}

/* rating */
.ratebox{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px;display:grid;gap:10px}
.rb-q{font-weight:900;font-size:15px}
.stars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rb{border:1.5px solid var(--line);background:var(--paper);border-radius:11px;padding:9px 2px 8px;display:grid;justify-items:center;gap:3px;min-width:0;transition:transform .1s}
.rb:hover{border-color:var(--ink)}
.rb:active{transform:scale(.96)}
.rb b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.rb span{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rb[aria-pressed="true"]{color:var(--r-ink);border-color:transparent}
.rb1[aria-pressed="true"]{background:var(--r1)}.rb2[aria-pressed="true"]{background:var(--r2)}
.rb3[aria-pressed="true"]{background:var(--r3);color:var(--r3-ink)}.rb4[aria-pressed="true"]{background:var(--r4)}
.rb5[aria-pressed="true"]{background:var(--r5)}
.rb-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.rb-nav button{border:1.5px solid var(--line);background:transparent;border-radius:9px;padding:6px 11px;font-weight:700;font-size:13.5px}
.rb-nav .kbd{color:var(--muted);display:none}
@media (hover:hover) and (min-width:980px){.rb-nav .kbd{display:inline}}

.info{display:grid;gap:0;margin:0}
.info div{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;padding:9px 0;border-top:1px dashed var(--line)}
.info dt{font-weight:700;font-size:13px;color:var(--muted)}
.info dd{margin:0;font-size:14.5px;line-height:1.55}
.links{display:flex;gap:6px;flex-wrap:wrap}
.links a{text-decoration:none;font-size:13px;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--card)}
.links a:hover{border-color:var(--accent);color:var(--accent)}
.fine{font-size:12.5px;color:var(--muted);margin:0}
.scenes{display:grid;gap:6px}
.scenes b{font-size:13px;color:var(--muted)}
.scenes .sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.scenes a{position:relative;display:block;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--line)}
.scenes img{width:100%;height:100%;object-fit:cover;display:block}
.scenes a span{position:absolute;left:4px;bottom:4px;background:var(--shade);color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px}
@media (max-width:420px){.info div{grid-template-columns:1fr;gap:2px}}
/* phones & tablets: the 1–5 bar stays pinned to the bottom while you look at photos */
@media (max-width:979px){
  .ratebox{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:16px 16px 0 0;border-width:2px 0 0;gap:7px;
    padding:9px max(12px,env(safe-area-inset-right,0px)) calc(9px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
    box-shadow:0 -8px 24px rgba(0,0,0,.14)}
  .rb-q{font-size:13.5px}
  .rb{padding:6px 2px 5px}.rb b{font-size:22px}.rb span{font-size:11px}
  .rb-nav button{padding:4px 10px;font-size:13px}
  .place{padding-bottom:170px}
  .toast{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto}
}
@media (max-width:600px){
  .brand .sub{display:none}
  .status{font-size:12px}
  .me-pill{font-size:14px;padding:6px 8px;gap:6px}
  .me-pill .chip{padding:5px 10px;font-size:13px}
  nav.tabs a{padding:9px 10px;font-size:14.5px}
}
@media (min-width:980px){
  .place{grid-template-columns:minmax(0,1.6fr) minmax(360px,1fr);gap:28px;align-items:start}
  .gal-col{position:sticky;top:12px}
  .rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));overflow:visible}
  .rail button{flex:none}
}

/* ---- browse grid ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.tile-ph{position:relative;display:block;padding:0;border:none;aspect-ratio:16/10;background:var(--line);width:100%}
.tile-ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile-ph .count{position:absolute;right:8px;bottom:8px;background:var(--shade);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.tile-ph .mine{position:absolute;left:8px;top:8px;font-size:12.5px;font-weight:900;padding:3px 9px;border-radius:999px;color:var(--r-ink)}
.tile-bd{padding:10px 12px 12px;display:grid;gap:6px;align-content:start}
.tile-nm{border:none;background:none;padding:0;text-align:left;font-family:var(--display);font-size:19px;line-height:1.2}
.tile-nm:hover{color:var(--accent)}
.tile-sub{font-size:12.5px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mini button{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 0;font-weight:900;font-size:14px;font-variant-numeric:tabular-nums}
.mini button:hover{border-color:var(--ink)}
.mini button[aria-pressed="true"]{color:var(--r-ink);border-color:transparent}
.mini button.m1[aria-pressed="true"]{background:var(--r1)}.mini button.m2[aria-pressed="true"]{background:var(--r2)}
.mini button.m3[aria-pressed="true"]{background:var(--r3);color:var(--r3-ink)}.mini button.m4[aria-pressed="true"]{background:var(--r4)}
.mini button.m5[aria-pressed="true"]{background:var(--r5)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700}

/* ---- results ---- */
.progress{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.progress h2,.podium h2{margin:0;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.legend{font-size:13px;color:var(--muted);font-weight:500}
.prog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 16px}
.prog{display:grid;gap:4px;font-size:13.5px}
.prog .pn{display:flex;align-items:center;gap:6px}
.prog .pst{color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.podium{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.podium{grid-template-columns:minmax(0,1fr)}}
.podium section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.rank{display:grid;grid-template-columns:26px 64px minmax(0,1fr) auto;gap:10px;align-items:center}
.rank img{width:64px;height:44px;object-fit:cover;border-radius:7px;background:var(--line)}
.rank .n{font-family:var(--display);font-size:21px;color:var(--accent);text-align:center}
.rank .nm{font-weight:700;font-size:14.5px;line-height:1.25;border:none;background:none;padding:0;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.rank .who2{font-size:12px;color:var(--muted)}
.rank .sc{font-variant-numeric:tabular-nums;font-weight:900;font-size:15px;text-align:right;line-height:1.2}
.rank .sc small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.meter{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--hi)}
.more{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13.5px;text-align:left}

/* who picker */
.me-pill{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:8px 10px;font-size:15px}
.ini{display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;color:#fff;font-weight:900;line-height:1}
.chip .ini{width:1.6em;height:1.6em;font-size:12px;margin-right:2px;vertical-align:middle}
.who-list{display:flex;gap:8px;flex-wrap:wrap}
.picker h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,36px);margin:0}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;max-width:900px}
.who-big{display:grid;justify-items:center;gap:6px;padding:18px 10px;border-radius:16px;border:2px solid var(--line);background:var(--card);transition:transform .12s,border-color .12s}
.who-big:hover{transform:translateY(-2px);border-color:var(--accent)}
.who-big .big-av{font-size:26px;line-height:1}
.who-big .big-av .ini{width:2.2em;height:2.2em}
.who-big .big-nm{font-weight:900;font-size:18px}
.who-big .done{font-size:12px;font-weight:700;color:var(--good)}
.who-big .done.todo{color:var(--muted)}
.who-big.add{border-style:dashed;color:var(--muted)}
.dialog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dialog[hidden]{display:none}
.dialog input{flex:1;min-width:140px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:15px}
.done-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px}
.done-box h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(8,6,12,.95);z-index:40;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:8px;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));color:#fff}
.lb[hidden]{display:none}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.lb-top .btn{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.lb-stage{position:relative;min-height:0;overflow:hidden}
.lb-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;touch-action:pan-y}
.lb-stage .nav{z-index:1;position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:32px;display:grid;place-items:center}
.lb-stage .nav:hover{background:rgba(255,255,255,.3)}
.lb-stage .nav.prev{left:4px}.lb-stage .nav.next{right:4px}
.lb-cap{margin:0;text-align:center;font-size:14px}
.lb-cap a{color:#FFD45A;font-weight:700}
.lb-dots{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;justify-content:safe center}
.lb-dots button{width:72px;height:46px;flex:0 0 72px;border-radius:6px;overflow:hidden;opacity:.5;border:2px solid transparent;background:#222;padding:0}
.lb-dots button img{width:100%;height:100%;object-fit:cover;display:block}
.lb-dots button.on{opacity:1;border-color:#fff}
.credits{font-size:13px;line-height:1.6;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>오사카 <b>골라골라</b></h1>

const DEFAULT_MEMBERS=["지유","시유","혜영","진욱","만자","민성","쁘다"];

const LEGACY={must:5,maybe:3,skip:1};          // swipe-era votes: 꼭 가기 / 고민 중 / 패스
function toR(v){ if(v===undefined||v===null||v==="") return 0; if(LEGACY[v]) return LEGACY[v]; const n=Math.round(+v); return n>=1&&n<=5?n:0; }

/* ---------- state: every rating is saved to the family Google Sheet ---------- */
/* Apps Script web app that writes rows into "Votes (투표 기록)" of the planner sheet. */
const API_URL="https://script.google.com/macros/s/AKfycbxrcadK_zz3urolbZRuoWLiUQsELv0U_i9Us3XQyR2qf7EKFSemN3ysnmMt8oY8hunWWg/exec";
const LS="osakaPick.v2";
function lsGet(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}}}
function lsSet(v){try{localStorage.setItem(LS,JSON.stringify(v))}catch(e){}}
let local=lsGet();      // {me, extra:[], cache:{members,extraNames}, pending:{name:{id:"1".."5"|""}}, lastSaved}
local.extra=local.extra||[]; local.pending=local.pending||{}; local.cache=local.cache||{members:{}};
// swipe-era values still waiting on this phone become ratings
Object.values(local.pending).forEach(p=>Object.keys(p).forEach(id=>{ if(p[id]==="") return; const n=toR(p[id]); if(n) p[id]=String(n); else delete p[id]; }));
function normMembers(ms){ const out={};
  Object.entries(ms||{}).forEach(([name,m])=>{ const r={}, src=(m&&m.ratings)||(m&&m.swipes)||{};
    Object.entries(src).forEach(([id,v])=>{ const n=toR(v); if(n) r[id]=n; }); out[name]={ratings:r,updatedAt:(m&&m.updatedAt)||""}; });
  return out; }
let me=local.me||"";
let server={members:normMembers(local.cache.members), extraNames:local.cache.extraNames||[]};
let net={loading:true, saving:false, error:"", lastSaved:local.lastSaved||""};

function memberNames(){
  const s=new Set([...DEFAULT_MEMBERS,...(server.extraNames||[]),...local.extra]);
  Object.keys(server.members||{}).forEach(n=>s.add(n));
  Object.keys(local.pending).forEach(n=>s.add(n));
  return [...s];
}
function ratingsOf(name){
  const out={...((server.members[name]||{}).ratings||{})};
  Object.entries(local.pending[name]||{}).forEach(([id,v])=>{ const n=toR(v); if(n) out[id]=n; else delete out[id]; });
  return out;
}
function setRating(name,id,n){            // n = 1..5, or 0 to clear
  if((ratingsOf(name)[id]||0)===n) return false;
  // always queue the change, even back to the old value: a save may already be on its way with the previous value
  (local.pending[name]||(local.pending[name]={}))[id]=n?String(n):"";
  lsSet(local); setStatus(); scheduleFlush(300); return true;
}
function allData(){ const out={}; memberNames().forEach(n=>{ const r=ratingsOf(n); if(Object.keys(r).length) out[n]=r; }); return out; }
function doneCount(n){ const r=ratingsOf(n); return ITEMS.filter(i=>r[i.id]).length; }
function pendingCount(){ return Object.values(local.pending).reduce((a,p)=>a+Object.keys(p).length,0); }

/* --- network --- */
async function fetchState(){
  try{
    const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),15000);
    const r=await fetch(API_URL+"?t="+Date.now(),{signal:ctl.signal}); clearTimeout(tm);
    const j=await r.json(); if(!j.ok) throw new Error(j.error||"bad response");
    server={members:normMembers(j.members),extraNames:j.extraNames||[]};
    local.cache={members:server.members,extraNames:server.extraNames}; lsSet(local);
    net.error="";
  }catch(e){ net.error="offline"; }
  net.loading=false; setStatus(); refreshViews();
}
let flushTimer=null, backoff=3000;
function scheduleFlush(ms){ clearTimeout(flushTimer); flushTimer=setTimeout(flush,ms); }
const voteRows=batch=>Object.entries(batch).map(([id,v])=>({id,v,place:(BY[id]||{}).ko||"",cat:CAT[(BY[id]||{}).cat]||""}));
async function flush(){
  if(net.saving) return;
  const names=Object.keys(local.pending).filter(n=>Object.keys(local.pending[n]).length);
  if(!names.length){ setStatus(); return; }
  net.saving=true; setStatus();
  try{
    for(const name of names){
      const batch={...local.pending[name]};
      const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"vote",name,votes:voteRows(batch)})});
      const j=await r.json(); if(!j.ok||j.version!==2) throw new Error(j.error||"save failed");
      // confirmed: fold into the server copy, drop from pending only if unchanged since we sent it
      const sm=server.members[name]||(server.members[name]={ratings:{}}); sm.ratings=sm.ratings||{};
      Object.entries(batch).forEach(([id,v])=>{ const n=toR(v); if(n) sm.ratings[id]=n; else delete sm.ratings[id];
        if(local.pending[name]&&local.pending[name][id]===v) delete local.pending[name][id]; });
      if(local.pending[name]&&!Object.keys(local.pending[name]).length) delete local.pending[name];
    }
    local.cache={members:server.members,extraNames:server.extraNames};
    net.lastSaved=local.lastSaved=new Date().toISOString(); net.error=""; backoff=3000; lsSet(local);
  }catch(e){
    net.error="offline"; lsSet(local); scheduleFlush(backoff); backoff=Math.min(backoff*2,60000);
  }
  net.saving=false; setStatus();
  if(pendingCount()) scheduleFlush(1500);
}
function beaconPending(){            // last-chance send when the page is closed
  if(!navigator.sendBeacon) return;
  Object.entries(local.pending).forEach(([name,p])=>{ const votes=voteRows(p);
    if(votes.length) try{ navigator.sendBeacon(API_URL,new Blob([JSON.stringify({action:"vote",name,votes})],{type:"text/plain;charset=utf-8"})); }catch(e){} });
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") beaconPending(); else fetchState().then(flush); });
window.addEventListener("pagehide",beaconPending);
window.addEventListener("online",()=>{ flush(); fetchState(); });
setInterval(()=>{ if(document.visibilityState==="visible") fetchState(); },30000);
async function addNameRemote(n){ try{ await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"addName",name:n})}); }catch(e){} }
/* Votes carried over from the old claude.ai version: #import=<base64 JSON {members:{name:{swipes|ratings}}}> */
function importFromHash(){
  const m=location.hash.match(/^#import=([A-Za-z0-9_\-+/=%]+)/); if(!m) return;
  try{
    const raw=decodeURIComponent(m[1]).replace(/-/g,"+").replace(/_/g,"/");
    const data=JSON.parse(decodeURIComponent(escape(atob(raw))));
    let n=0;
    Object.entries(data.members||{}).forEach(([name,mm])=>{ Object.entries((mm&&(mm.ratings||mm.swipes))||{}).forEach(([id,v])=>{
      const k=toR(v); if(BY[id]&&k){ (local.pending[name]||(local.pending[name]={}))[id]=String(k); n++; } }); });
    lsSet(local); history.replaceState(null,"",location.pathname+"#rate");
    if(n) setTimeout(()=>toast(`이전 투표 ${n}개를 가져와서 구글 시트에 저장할게요`),400);
  }catch(e){ history.replaceState(null,"",location.pathname+"#rate"); }
}

function setStatus(){
  const pc=pendingCount(), ok=!net.error&&!pc&&!net.loading;
  const t=net.lastSaved?new Date(net.lastSaved).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}):"";
  $("#dot").classList.toggle("on",ok);
  $("#statusText").textContent=
      net.loading ? "가족 점수 불러오는 중…"
    : net.saving ? `⏳ 구글 시트에 저장 중… (${pc}개)`
    : pc&&net.error ? `⚠️ 인터넷 연결 확인 중 · ${pc}개는 이 기기에 안전하게 보관, 연결되면 자동 저장`
    : pc ? `⏳ 저장 대기 ${pc}개`
    : net.error ? "⚠️ 인터넷 연결 확인 중 · 마지막으로 불러온 점수를 보여주고 있어요"
    : `✅ 모든 점수가 가족 구글 시트에 저장됨${t?` · 마지막 저장 ${t}`:""} · 창을 닫아도 안전해요`;
}

  </div>`;
}
function galGo(g,i){ const n=photosOf(BY[g.dataset.gal]).length; i=(i+n)%n; const st=g.querySelector(".strip");
  st.scrollTo({left:i*st.clientWidth,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); galSync(g,i); }
function galSync(g,i){
  if(+g.dataset.i===i) return; g.dataset.i=i; const ps=photosOf(BY[g.dataset.gal]);
  const c=g.querySelector(".count"); if(c) c.textContent=`${i+1} / ${ps.length}`;
  g.querySelector(".cap").innerHTML=capHTML(ps[i]);
  const rail=g.querySelector(".rail"); if(rail){ rail.querySelectorAll("button").forEach((b,k)=>b.classList.toggle("on",k===i));
    const b=rail.children[i]; if(b&&rail.scrollWidth>rail.clientWidth) rail.scrollTo({left:b.offsetLeft-rail.clientWidth/2+b.clientWidth/2,behavior:"smooth"}); }
}
document.addEventListener("scroll",e=>{
  const st=e.target; if(!st.classList||!st.classList.contains("strip")) return;
  const g=st.closest(".gal"); galSync(g,Math.round(st.scrollLeft/Math.max(1,st.clientWidth)));
},true);

/* ---------- who is rating ---------- */
const AV_COLORS=["#E0412B","#2F6FDE","#1F8A5B","#B9478F","#D98A00","#6A4FC4","#0E8C93","#7A5A3A"];
function av(n){ let h=0; for(const ch of n) h=(h*31+ch.codePointAt(0))>>>0;
  const i=DEFAULT_MEMBERS.indexOf(n); const c=AV_COLORS[(i>=0?i:h)%AV_COLORS.length];
  return `<span class="ini" style="background:${c}">${esc([...n][0]||"?")}</span>`; }
let whoOpen=false;
function selectMe(n){me=n;local.me=n;lsSet(local);whoOpen=false;curId=null;hist=[];renderWho();route();window.scrollTo({top:0,behavior:"smooth"});toast(`${n}님 차례예요!`)}
function passPhone(){me="";local.me="";lsSet(local);whoOpen=false;curId=null;hist=[];renderWho();route();window.scrollTo({top:0})}
function renderWho(){

      <button class="chip" type="button" data-pass>📱 다음 사람에게 넘기기</button></div>
    ${whoOpen?`<div class="who-list">${memberNames().map(n=>{const d=doneCount(n);return `<button class="chip" type="button" aria-pressed="${n===me}" data-name="${esc(n)}">${av(n)} ${esc(n)}${d?` · ${d}/${ITEMS.length}`:""}</button>`}).join("")}<button class="chip add" type="button" id="addBtn">+ 이름 추가</button></div>`:""}`;
  $("#switchBtn").onclick=()=>{whoOpen=!whoOpen;renderWho()};

}
$("#addCancel").onclick=()=>{$("#addDlg").hidden=true};
$("#addOk").onclick=()=>{const v=$("#addName").value.trim();if(!v)return;if(!local.extra.includes(v))local.extra.push(v);lsSet(local);addNameRemote(v);$("#addName").value="";$("#addDlg").hidden=true;selectMe(v)};
$("#addName").addEventListener("keydown",e=>{if(e.key==="Enter")$("#addOk").click()});
function needMe(){

    <div class="pick-grid">${memberNames().map(n=>{const d=doneCount(n);return `<button type="button" class="who-big" data-pick="${esc(n)}"><span class="big-av" aria-hidden="true">${av(n)}</span><span class="big-nm">${esc(n)}</span><span class="done${d?"":" todo"}">${d>=ITEMS.length?"✓ 완료":d?`진행 중 · ${d}/${ITEMS.length}`:"아직 시작 전"}</span></button>`}).join("")}
      <button type="button" class="who-big add" id="addBig"><span class="big-av" aria-hidden="true">➕</span><span class="big-nm">다른 이름</span></button></div>

/* ---------- 점수 주기: one place at a time ---------- */
let cat="all", curId=null, hist=[];
const pool=()=>ITEMS.filter(i=>cat==="all"||i.cat===cat);
function segHTML(){ return `<div class="seg" role="group" aria-label="분류">${CATS.map(([k,t])=>`<button type="button" data-cat="${k}" aria-pressed="${cat===k}">${t}</button>`).join("")}</div>`; }
function progHTML(){ const P=pool(), r=ratingsOf(me), d=P.filter(i=>r[i.id]).length;
  return `<div class="prog-line"><span>${esc(me)} · ${d}/${P.length}곳</span><div class="bar"><i style="width:${Math.round(d/Math.max(1,P.length)*100)}%"></i></div></div>`; }
function updateProg(){ const el=document.querySelector(".prog-line"); if(el) el.outerHTML=progHTML(); }
function nextUnrated(after){
  const P=pool(), r=ratingsOf(me), s=after?P.findIndex(i=>i.id===after):-1;
  for(let k=1;k<=P.length;k++){ const it=P[(s+k)%P.length]; if(it.id!==after&&!r[it.id]) return it.id; }
  return null;
}
function nextInPool(after){ const P=pool(), s=P.findIndex(i=>i.id===after); return P.length?P[(s+1)%P.length].id:null; }
function rateHTML(it,mine){
  return `<div class="ratebox" role="group" aria-label="점수 주기">
    <div class="rb-q">${esc(me)}님, 여기 얼마나 가고 싶어요?</div>
    <div class="stars">${[1,2,3,4,5].map(n=>`<button type="button" class="rb rb${n}" data-rate="${n}" aria-pressed="${mine===n}"><b>${n}</b><span>${RATE[n]}</span></button>`).join("")}</div>
    <div class="rb-nav"><button type="button" data-nav="prev">← 이전</button><span class="kbd">키보드: 1~5 점수 · ←→ 사진</span><button type="button" data-nav="later">${mine?"다음 →":"나중에 →"}</button></div>
  </div>`;
}
function placeHTML(it,mine){
  return `<article class="place" data-place="${it.id}">
    <div class="gal-col">${galHTML(it)}</div>
    <div class="info-col">
      <header class="ph-head"><span class="crumb">${esc(CAT[it.cat])} · ${esc(it.area)}</span><h2>${esc(it.ko)}</h2><span class="en">${esc(it.en)}</span></header>
      ${rateHTML(it,mine)}
      <p class="desc">${esc(it.d)}</p>
      ${factsHTML(it)}
      ${detailHTML(it)}
      ${scenesHTML(it)}
    </div></article>`;
}
function renderRate(){
  if(needMe()) return;
  const P=pool(), r=ratingsOf(me);
  if(!curId||!BY[curId]) curId=nextUnrated(null);
  const top=`<div class="toolbar">${segHTML()}${progHTML()}</div>`;
  if(!curId){
    $("#main").innerHTML=`<section class="panel">${top}<div class="done-box"><h2>🎉 ${esc(me)}님, ${P.length}곳 모두 점수를 줬어요</h2>
      <p class="hint">점수는 언제든 바꿀 수 있어요. ‘전체 보기’에서 한눈에 보고 고쳐보세요.</p>
      <div class="btnrow"><a class="btn" href="#results">📊 가족 결과 보기</a><a class="btn ghost" href="#list">🗂 전체 보기에서 바꾸기</a><button class="btn ghost" type="button" data-pass>📱 다음 사람에게 넘기기</button></div></div></section>`;
    return;
  }
  const it=BY[curId];
  $("#main").innerHTML=`<section class="panel">${top}${placeHTML(it,r[it.id]||0)}</section>`;
}
function showPlace(id){ curId=id; renderRate(); const m=$("#main"); if(m.getBoundingClientRect().top<0) window.scrollTo({top:window.scrollY+m.getBoundingClientRect().top-8}); }
function rateCurrent(n){
  const id=curId; if(!id) return; const was=ratingsOf(me)[id]||0;
  if(was===n){ goNext(); return; }
  setRating(me,id,n);
  document.querySelectorAll(".ratebox [data-rate]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.rate===n)));
  updateProg();
  if(was){ toast(`${n}점(${RATE[n]})으로 바꿨어요`); const l=document.querySelector('[data-nav="later"]'); if(l) l.textContent="다음 →"; return; }
  setTimeout(()=>{ if(curId!==id) return; hist.push(id); showPlace(nextUnrated(id)); },260);
}
function goNext(){ const id=curId; const nx=nextUnrated(id)||nextInPool(id); if(!nx||nx===id){ toast("남은 곳이 없어요"); return; } hist.push(id); showPlace(nx); }
function goPrev(){ let id=hist.pop(); if(!id){ const P=pool(), s=P.findIndex(i=>i.id===curId); id=P[(s-1+P.length)%P.length].id; } showPlace(id); }

/* ---------- 전체 보기: everything at once ---------- */
let todoOnly=false;

function renderList(){

    <p class="hint">숫자를 누르면 바로 저장돼요 (1 패스 · 2 글쎄요 · 3 괜찮아요 · 4 가고 싶어요 · 5 꼭 가요). 같은 숫자를 다시 누르면 지워져요. 사진을 누르면 자세히 볼 수 있어요.</p>
    <div class="tiles">${P.map(it=>tileHTML(it,r[it.id]||0)).join("")||`<p class="hint">모두 점수를 줬어요 🎉</p>`}</div></section>`;
  $("#todoOnly").onchange=e=>{todoOnly=e.target.checked;renderList();};
}

/* ---------- 가족 결과 ---------- */
function scores(){
  const data=allData(), sc={};
  ITEMS.forEach(i=>sc[i.id]={sum:0,n:0,by:{1:[],2:[],3:[],4:[],5:[]}});
  Object.entries(data).forEach(([name,r])=>Object.entries(r).forEach(([id,k])=>{ const s=sc[id]; if(!s) return; s.sum+=k; s.n++; s.by[k].push(name); }));
  Object.values(sc).forEach(s=>s.avg=s.n?s.sum/s.n:0);
  return {sc,data};
}
let resOpen={};
function renderResults(){
  const {sc,data}=scores(); const names=memberNames();
  const list=c=>ITEMS.filter(i=>i.cat===c).map(i=>({it:i,...sc[i.id]})).sort((a,b)=>(b.avg-a.avg)||(b.n-a.n));
  const row=(r,k)=>`<div class="rank"><span class="n">${k+1}</span><img src="${esc(coverOf(r.it).t||coverOf(r.it).s)}" alt="" loading="lazy" referrerpolicy="no-referrer"><div><button class="nm" type="button" data-open="${r.it.id}">${esc(r.it.ko)}</button>
      <div class="who2">${[5,4,3,2,1].filter(k=>r.by[k].length).map(k=>`${k}점 ${esc(r.by[k].join(", "))}`).join(" · ")||"아직 점수 없음"}</div>
      <div class="meter"><i style="width:${Math.round(r.avg/5*100)}%"></i></div></div><span class="sc">${r.n?`${r.avg.toFixed(1)}<small>${r.n}명</small>`:"<small>—</small>"}</span></div>`;
  $("#main").innerHTML=`<section class="panel">
    <section class="progress"><h2>📈 진행 상황 <span class="legend">한 곳 고를 때마다 바로 반영돼요 · 끝까지 안 해도 결과에 들어가요</span></h2>
      <div class="prog-grid">${names.map(n=>{const r=data[n]||{}; const v=ITEMS.map(i=>r[i.id]).filter(Boolean); const pct=Math.round(v.length/ITEMS.length*100);
        return `<div class="prog"><span class="pn">${av(n)} <b>${esc(n)}</b></span><span class="pst">${v.length===0?"아직 시작 전":v.length>=ITEMS.length?"✓ 완료":`진행 중 · ${v.length}/${ITEMS.length}`}${v.length?` · 평균 ${(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1)}점 줌`:""}</span>
          <div class="pbar"><i style="width:${pct}%"></i></div></div>`}).join("")}</div></section>
    <div class="podium">
      ${[["food","🍜 먹거리"],["cafe","☕ 카페·디저트"],["sights","⛩️ 명소"]].map(([c,t])=>{const L=list(c),open=resOpen[c];return `<section><h2>${t} 순위 <span class="legend">${L.length}곳 · 평균 점수</span></h2>${L.slice(0,open?L.length:10).map(row).join("")}${L.length>10?`<button class="more" type="button" data-more="${c}">${open?"접기 ▴":`전체 ${L.length}곳 보기 ▾`}</button>`:""}</section>`}).join("")}
    </div>
    <p class="legend">점수는 점수를 준 사람들의 평균이에요 (1 패스 · 2 글쎄요 · 3 괜찮아요 · 4 가고 싶어요 · 5 꼭 가요). 평균이 같으면 더 많은 사람이 점수를 준 곳이 위로 가요.</p>
    <div class="btnrow"><button class="btn" type="button" id="copyRes">카톡에 붙여넣을 결과 복사</button></div>
  </section>`;
  $("#main").querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{resOpen[b.dataset.more]=!resOpen[b.dataset.more];renderResults()});
  $("#copyRes").onclick=async()=>{
    const top=(c,n)=>list(c).filter(r=>r.n).slice(0,n).map((r,k)=>`${k+1}. ${r.it.ko} (평균 ${r.avg.toFixed(1)}점 · ${r.n}명)`).join("\n")||"아직 없음";
    const t=`[오사카 가족 점수 결과]\n🍜 먹거리 TOP5\n${top("food",5)}\n☕ 카페·디저트 TOP3\n${top("cafe",3)}\n⛩️ 명소 TOP5\n${top("sights",5)}`;
    try{await navigator.clipboard.writeText(t);toast("복사했어요! 카톡에 붙여넣기 하세요")}catch(e){toast("복사가 막혀 있어요. 화면을 캡처해 공유해주세요")}
  };
}
function renderCredits(){
  $("#main").innerHTML=`<section class="panel"><p class="hint">사진마다 아래 캡션에 출처가 있어요. 위키미디어 사진은 각 라이선스에 따라, 유튜브 사진은 영상 썸네일이에요. 가족 여행 계획용으로만 써요.</p>
  <ol class="credits">${ITEMS.map(i=>`<li><b>${esc(i.ko)}</b> — ${photosOf(i).filter(p=>p.h).map(p=>`<a href="${esc(p.h)}" target="_blank" rel="noopener">${esc((p.c||"").replace(/^[^\s]+\s/,"").slice(0,40))}</a>`).join(" · ")}</li>`).join("")}</ol></section>`;
}

/* ---------- clicks & keys ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  const st=t.closest("[data-step]"); if(st){ e.preventDefault(); if(st.closest("#lb")) stepLB(+st.dataset.step); else { const g=st.closest(".gal"); galGo(g,+g.dataset.i+(+st.dataset.step)); } return; }
  const go=t.closest("[data-goto]"); if(go){ galGo(go.closest(".gal"),+go.dataset.goto); return; }
  const z=t.closest("[data-zoom]"); if(z&&z.closest(".gal")){ const g=z.closest(".gal"); openLB(g.dataset.gal,z.dataset.zoom==="cur"?+g.dataset.i:+z.dataset.zoom); return; }
  const dot=t.closest("[data-lbi]"); if(dot){ lb.i=+dot.dataset.lbi; renderLB(); return; }
  if(t.id==="lb"||t.classList.contains("lb-stage")){ closeLB(); return; }
  const rb=t.closest("[data-rate]"); if(rb){ rateCurrent(+rb.dataset.rate); return; }
  const nv=t.closest("[data-nav]"); if(nv){ if(nv.dataset.nav==="prev") goPrev(); else goNext(); return; }
  const q=t.closest("[data-qrate]"); if(q){ const id=q.dataset.qrate, n=+q.dataset.n, cur=ratingsOf(me)[id]||0;
    setRating(me,id,cur===n?0:n); const tile=q.closest(".tile"); if(tile) tile.outerHTML=tileHTML(BY[id],ratingsOf(me)[id]||0);
    toast(cur===n?"점수를 지웠어요":`${BY[id].ko} · ${n}점 저장`); return; }
  const op=t.closest("[data-open]"); if(op){ e.preventDefault(); hist=[]; curId=op.dataset.open; if(view()==="rate") showPlace(curId); else location.hash="#rate"; return; }
  const c=t.closest("[data-cat]"); if(c){ cat=c.dataset.cat; if(view()==="list") renderList(); else { curId=null; hist=[]; renderRate(); } return; }
  if(t.closest("[data-pass]")){ passPhone(); return; }
});
document.addEventListener("keydown",e=>{
  if(!$("#lb").hidden){ if(e.key==="Escape")closeLB(); else if(e.key==="ArrowRight")stepLB(1); else if(e.key==="ArrowLeft")stepLB(-1); else return; e.preventDefault(); return; }
  if(e.target.matches("input,textarea")||e.metaKey||e.ctrlKey||e.altKey) return;
  if(view()!=="rate"||!me||!curId) return;
  if(/^[1-5]$/.test(e.key)){ e.preventDefault(); rateCurrent(+e.key); }
  else if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ const g=document.querySelector(".place .gal"); if(g){ e.preventDefault(); galGo(g,+g.dataset.i+(e.key==="ArrowRight"?1:-1)); } }
});

/* ---------- routing ---------- */
const VIEWS={rate:renderRate,list:renderList,results:renderResults,credits:renderCredits};
function view(){ let h=(location.hash||"#rate").slice(1); if(h==="swipe") h="rate"; return VIEWS[h]?h:"rate"; }
function route(){
  const v=view();
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===v?"page":"false"));
  VIEWS[v]();
}
window.addEventListener("hashchange",()=>{ route(); window.scrollTo({top:0}); });
importFromHash(); renderWho(); setStatus(); route();
fetchState().then(flush);
</script>
</body>
</html>
