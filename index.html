<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osaka Family Pick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: Dotonbori signboard — paper-white ground, ink type, vermilion "VS" and mustard highlights; one big decision on screen at a time. */
:root{
  --paper:#F6F2EA; --card:#FFFFFF; --ink:#1C1A22; --muted:#6C6776; --line:#E3DDD2;
  --accent:#E0412B; --accent-ink:#FFFFFF; --hi:#F2B705; --good:#1F8A5B; --skip:#8A8494;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141218; --card:#1E1B24; --ink:#F2EEE6; --muted:#A49EAE; --line:#2E2A36;
    --accent:#FF5A43; --accent-ink:#1A0F0C; --hi:#F5C431; --good:#3CC48A; --skip:#8E879A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141218; --card:#1E1B24; --ink:#F2EEE6; --muted:#A49EAE; --line:#2E2A36;
  --accent:#FF5A43; --accent-ink:#1A0F0C; --hi:#F5C431; --good:#3CC48A; --skip:#8E879A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);}
body{min-height:100%;}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:16px}
header.top{display:grid;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1;margin:0;letter-spacing:.5px;text-wrap:balance}
.brand h1 b{color:var(--accent);font-weight:400}
.brand .sub{color:var(--muted);font-size:14px}
.status{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--skip);display:inline-block}
.dot.on{background:var(--good)}
.who{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who .label{font-weight:700;font-size:14px;margin-right:2px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}
nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
nav.tabs a{text-decoration:none;padding:10px 14px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.panel{display:grid;gap:16px}
.hint{color:var(--muted);font-size:14px;margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;text-align:left;color:var(--ink);padding:0}
.card .ph{position:relative;aspect-ratio:4/3;background:var(--line)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph .ex{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px 7px;border-radius:6px}
.card .ph .buzz{position:absolute;right:8px;top:8px;background:var(--hi);color:#1C1A22;font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px}
.card .bd{padding:12px 14px 14px;display:grid;gap:6px;align-content:start}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.15;text-wrap:balance}
.card .en{color:var(--muted);font-size:13px}
.card p{margin:0;font-size:14.5px;line-height:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:12px;border-radius:6px;padding:3px 7px;background:var(--paper);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.tag.easy{border-color:var(--good);color:var(--good)}
.tag.hard{border-color:var(--accent);color:var(--accent)}
/* world cup */
.round{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.round .r{font-family:var(--display);font-size:24px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.duel .card{transition:transform .15s, box-shadow .15s}
.duel .card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.duel .pick{border:none;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:15px;padding:12px;border-radius:0 0 16px 16px;width:100%}
.vs{font-family:var(--display);font-size:42px;color:var(--accent)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:none;border-radius:12px;padding:12px 18px;font-weight:900;font-size:15px;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
/* swipe */
.stack{display:grid;justify-items:center;gap:14px}
.stack .card{max-width:440px;width:100%;touch-action:pan-y;user-select:none}
.stack .card.drag{transition:none}
.stack .card.fly{transition:transform .3s, opacity .3s}
.vote3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:440px;width:100%}
.vote3 button{border:none;border-radius:12px;padding:14px 6px;font-weight:900;font-size:15px;display:grid;gap:2px}
.vote3 small{font-weight:500;font-size:11px;opacity:.85}
.v-skip{background:var(--line);color:var(--ink)}
.v-maybe{background:var(--hi);color:#1C1A22}
.v-must{background:var(--accent);color:var(--accent-ink)}
/* results */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:900px){.podium{grid-template-columns:1fr 1fr}}
.podium section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;align-content:start}
.podium h2{margin:0;font-size:16px}
.rank{display:grid;grid-template-columns:28px 56px 1fr auto;gap:10px;align-items:center}
.rank img{width:56px;height:42px;object-fit:cover;border-radius:8px}
.rank .n{font-family:var(--display);font-size:22px;color:var(--accent);text-align:center}
.rank .nm{font-weight:700;font-size:14.5px;line-height:1.25}
.linkish{border:none;background:none;padding:0;color:var(--ink);text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.rank .who2{font-size:12px;color:var(--muted)}
.rank .sc{font-variant-numeric:tabular-nums;font-weight:900;font-size:15px}
.meter{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--hi)}
.legend{font-size:13px;color:var(--muted)}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.members div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;display:grid;gap:4px}
.members b{font-size:15px}
.more{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 10px;font-weight:700;font-size:13.5px;margin-top:4px;text-align:left}
.more:hover{border-color:var(--accent)}
.info{display:grid;gap:8px;margin:6px 0 0}
.info div{display:grid;grid-template-columns:118px 1fr;gap:8px;padding-top:8px;border-top:1px dashed var(--line)}
.info dt{font-weight:700;font-size:13px;color:var(--muted)}
.info dd{margin:0;font-size:14px;line-height:1.5}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.links a{text-decoration:none;font-size:13px;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--paper)}
.links a:hover{border-color:var(--accent);color:var(--accent)}
.fine{font-size:12px;color:var(--muted);margin:4px 0 0}
.sheet{position:fixed;inset:0;background:rgba(10,8,14,.55);display:grid;place-items:end center;z-index:20;padding:16px 0 0}
.sheet[hidden]{display:none}
.sheet-in{background:var(--paper);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:12px 16px 20px;display:grid;gap:10px}
.sheet .close{justify-self:end;padding:8px 12px}
@media (min-width:700px){.sheet{place-items:center}.sheet-in{border-radius:18px}}
@media (max-width:420px){.info div{grid-template-columns:1fr;gap:2px}}
.me-pill{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:8px 10px;font-size:15px}
.me-av{display:inline-flex}
.ini{display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;color:#fff;font-weight:900;line-height:1}
.chip .ini{width:1.6em;height:1.6em;font-size:12px;margin-right:2px;vertical-align:middle}
.who-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.picker h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,36px);margin:0;text-wrap:balance}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.who-big{display:grid;justify-items:center;gap:6px;padding:18px 10px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);transition:transform .12s,border-color .12s}
.who-big:hover{transform:translateY(-2px);border-color:var(--accent)}
.who-big .big-av{font-size:26px;line-height:1}
.who-big .big-av .ini{width:2.2em;height:2.2em}
.who-big .big-nm{font-weight:900;font-size:18px}
.who-big .done{font-size:12px;font-weight:700;color:var(--good)}
.who-big.add{border-style:dashed;color:var(--muted)}
.ph img{cursor:zoom-in}
.ph .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:26px;line-height:1;display:grid;place-items:center}
.ph .nav.prev{left:8px}.ph .nav.next{right:8px}
.ph .count{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px}
.thumbs{display:grid;gap:6px;margin-top:6px}
.thumbs b{font-size:13px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.tb{padding:0;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--line);aspect-ratio:16/10;cursor:zoom-in}
.tb img{width:100%;height:100%;object-fit:cover;display:block}
.lb{position:fixed;inset:0;background:rgba(8,6,12,.94);z-index:40;display:grid;grid-template-rows:auto 1fr auto auto;gap:8px;padding:12px 12px 18px;color:#fff}
.lb[hidden]{display:none}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.lb-top .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.lb-stage{position:relative;display:grid;place-items:center;min-height:0}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;touch-action:pan-y}
.lb-stage .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:30px;display:grid;place-items:center}
.lb-stage .nav.prev{left:4px}.lb-stage .nav.next{right:4px}
.lb-cap{margin:0;text-align:center;font-size:14px}
.lb-cap a{color:#FFD45A;font-weight:700}
.lb-dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.lb-dots button{width:9px;height:9px;border-radius:50%;border:none;background:rgba(255,255,255,.35);padding:0}
.lb-dots button.on{background:#fff}
.progress{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.progress h2{margin:0;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.prog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.prog{display:grid;gap:4px;font-size:13.5px}
.prog .pn{display:flex;align-items:center;gap:6px}
.prog .pst{color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good)}
.prog .pmix{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.who-big .done.todo{color:var(--muted)}
.ph .strip{display:flex;width:100%;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ph .strip::-webkit-scrollbar{display:none}
.ph .strip img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;scroll-snap-stop:always;background:var(--line)}
.ph .count{max-width:70%}
.lb-dots{overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;padding:2px 2px 6px;scrollbar-width:thin}
.lb-dots button{width:64px;height:44px;flex:0 0 64px;border-radius:6px;overflow:hidden;opacity:.55;border:2px solid transparent;background:#222}
.lb-dots button img{width:100%;height:100%;object-fit:cover;display:block}
.lb-dots button.on{opacity:1;border-color:#fff;background:#222}
.dialog[hidden]{display:none}
.credits{font-size:13px;line-height:1.6;color:var(--muted)}
.credits li{margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.dialog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dialog input{flex:1;min-width:140px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:15px}
@media (max-width:640px){
  .duel{grid-template-columns:1fr;gap:8px}
  .vs{text-align:center;font-size:30px;line-height:1}
  .duel .card .ph{aspect-ratio:16/9}
  .podium{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>오사카 <b>골라골라</b></h1>
      <span class="sub">Osaka Family Pick · 꼭 가기 · 고민 중 · 패스로 고르는 가족 여행 · Jan 2027</span>
    </div>
    <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">연결 확인 중…</span></div>
    <div class="who" id="who" aria-label="누가 투표하나요?"></div>
    <div class="dialog" id="addDlg" hidden>
      <label for="addName" class="label">이름 추가</label>
      <input id="addName" maxlength="12" placeholder="예: 삼촌">
      <button class="btn" id="addOk" type="button">추가</button>
      <button class="btn ghost" id="addCancel" type="button">취소</button>
    </div>
  </header>

  <nav class="tabs" aria-label="메뉴">
    <a href="#swipe" data-tab="swipe">👍 고르기</a>
    <a href="#results" data-tab="results">📊 가족 결과</a>
    <a href="#credits" data-tab="credits">사진 출처</a>
  </nav>

  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <div class="lb-top"><span id="lbTitle"></span><button class="btn ghost" type="button" id="lbClose" onclick="closeLB()">✕ 닫기</button></div>
  <div class="lb-stage"><button class="nav prev" type="button" data-step="-1" aria-label="이전 사진">‹</button><img id="lbImg" alt=""><button class="nav next" type="button" data-step="1" aria-label="다음 사진">›</button></div>
  <p class="lb-cap" id="lbCap"></p><div class="lb-dots" id="lbDots"></div>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="자세히 보기">
  <div class="sheet-in"><button class="btn ghost close" type="button" id="sheetClose" onclick="closeInfo()">✕ 닫기</button><div id="sheetBody"></div></div>
</div>

<script>
/* ---------- data ---------- */
const ITEMS=[
 {id:"f_millefeuille",cat:"cafe",ko:"그르니에 크림브륄레 밀푀유",en:"Grenier Umeda · crème brûlée mille-feuille",area:"우메다",price:"¥500~1,500 (약 ₩0.5~1.4만)",ease:1,buzz:"🔥 브이로그 5곳",ex:true,d:"2026년 오사카 브이로그에 가장 많이 나온 디저트. 바삭한 크림브륄레 밀푀유, 오후면 품절이라 포장 추천."},
 {id:"f_sushi",cat:"food",ko:"스시 사카바 사시스",en:"Sushi Sakaba Sasisu · Namba",area:"난바",price:"¥1,500~4,000 (약 ₩1.4~3.7만)",ease:1,buzz:"🔥 브이로그 3곳",ex:true,d:"한국 브이로그 3곳에 등장한 활기찬 가성비 스시바. 오픈 시간에 맞춰 가면 대기가 짧아요."},
 {id:"f_takoyaki",cat:"food",ko:"하나다코 타코야키",en:"Hanadako · takoyaki with green onion",area:"우메다",price:"¥500~1,500 (약 ₩0.5~1.4만)",ease:1,buzz:"🔥 브이로그 3곳",ex:true,d:"파를 산처럼 올린 타코야키. 서서 먹는 작은 가게라 간식으로 딱."},
 {id:"f_okonomiyaki",cat:"food",ko:"미즈노 오코노미야키",en:"Mizuno · okonomiyaki since 1945",area:"도톤보리",price:"¥500~1,500 (약 ₩0.5~1.4만)",ease:1,buzz:"미슐랭 빕구르망",ex:true,d:"1945년부터 가족이 운영하는 오코노미야키 명가. 줄이 있지만 회전이 빨라요."},

function photosOf(it){
  if(it._ps) return it._ps;
  const vid=it.v&&it.v[1].match(/v=([\w-]{11})/);
  const fr=t=>({cap:`🎥 영상 장면 · ${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`,href:vid?`https://www.youtube.com/watch?v=${vid[1]}&t=${t}s`:null});
  const ps=[{src:`img/${it.id}.jpg`,cap:it.mainCap||(it.ex?(it.exText||"예시 사진 · 위키미디어"):"📷 위키미디어 사진"),href:(CREDITS[it.id]||{}).u||null}];
  (GALLERY[it.id]||[]).forEach(([src,t])=>ps.push({src,...fr(t)}));
  (PHOTO_EXTRA[it.id]||[]).forEach(p=>ps.push(p.kind==="frame"?{src:p.src,...fr(p.t)}:{src:p.src,cap:p.cap,href:p.href}));
  // a real scene of the actual place goes first when the main photo is only an example of the dish
  if(it.ex&&ps.length>1&&ps[1].cap.startsWith("🎥 영상 장면")){ const ex=ps.shift(); ps.splice(1,0,ex); }
  return (it._ps=ps);
}

const mapUrl=i=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(i.q||i.en);
const photoUrl=i=>"https://www.google.com/search?tbm=isch&q="+encodeURIComponent((i.q||i.en)+" Osaka");
const EASE=[{t:"많이 걸어요",c:"hard"},{t:"조금 걸어요",c:""},{t:"할머니도 편해요",c:"easy"}];
const CAT={food:"먹거리",cafe:"카페·디저트",sights:"명소"};
const DEFAULT_MEMBERS=["지유","시유","혜영","진욱","만자","민성","쁘다"];
const SWIPE_PTS={must:3,maybe:1,skip:-1};
const SWIPE_KO={must:"꼭 가기",maybe:"고민 중",skip:"패스"};

/* ---------- state: every vote is saved to the family Google Sheet ---------- */
/* Apps Script web app that writes rows into "Votes (투표 기록)" of the planner sheet. */
const API_URL="https://script.google.com/macros/s/AKfycbxrcadK_zz3urolbZRuoWLiUQsELv0U_i9Us3XQyR2qf7EKFSemN3ysnmMt8oY8hunWWg/exec";
const LS="osakaPick.v2";
function lsGet(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}}}
function lsSet(v){try{localStorage.setItem(LS,JSON.stringify(v))}catch(e){}}
let local=lsGet();      // {me, extra:[], cache:{members}, pending:{name:{id:"must"|"maybe"|"skip"|""}}, lastSaved}
local.extra=local.extra||[]; local.pending=local.pending||{}; local.cache=local.cache||{members:{}};
let me=local.me||"";
let server={members:local.cache.members||{}, extraNames:local.cache.extraNames||[]};
let net={loading:true, saving:false, error:"", lastSaved:local.lastSaved||""};
let swipeCat="all";

function memberNames(){
  const s=new Set([...DEFAULT_MEMBERS,...(server.extraNames||[]),...local.extra]);
  Object.keys(server.members||{}).forEach(n=>s.add(n));
  Object.keys(local.pending).forEach(n=>s.add(n));
  return [...s];
}
function mergedSwipes(name){
  const out={...((server.members[name]||{}).swipes||{})};
  Object.entries(local.pending[name]||{}).forEach(([id,v])=>{ if(v) out[id]=v; else delete out[id]; });
  return out;
}
function getMember(name){ return {swipes:mergedSwipes(name)}; }
function saveMember(name,m){            // diff against what we have, queue the changes
  const cur=mergedSwipes(name), next=m.swipes||{};
  const p=local.pending[name]||(local.pending[name]={});
  new Set([...Object.keys(cur),...Object.keys(next)]).forEach(id=>{ if((cur[id]||"")!==(next[id]||"")) p[id]=next[id]||""; });
  if(!Object.keys(p).length) delete local.pending[name];
  lsSet(local); setStatus(); scheduleFlush(300);
}
function allMembersData(){
  const out={}; memberNames().forEach(n=>{ const sw=mergedSwipes(n); if(Object.keys(sw).length) out[n]={swipes:sw}; });
  return out;
}
function pendingCount(){ return Object.values(local.pending).reduce((a,p)=>a+Object.keys(p).length,0); }

/* --- network --- */
function apiReady(){ return /^https:\/\/script\.google\.com\//.test(API_URL); }
async function fetchState(){
  if(!apiReady()){ net.loading=false; net.error="no-api"; setStatus(); return; }
  try{
    const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),15000);
    const r=await fetch(API_URL+"?t="+Date.now(),{signal:ctl.signal}); clearTimeout(tm);
    const j=await r.json(); if(!j.ok) throw new Error(j.error||"bad response");
    server={members:j.members||{},extraNames:j.extraNames||[]};
    local.cache={members:server.members,extraNames:server.extraNames}; lsSet(local);
    net.error=""; 
  }catch(e){ net.error="offline"; }
  net.loading=false; setStatus(); refreshViews();
}
let flushTimer=null, backoff=3000;
function scheduleFlush(ms){ clearTimeout(flushTimer); flushTimer=setTimeout(flush,ms); }
async function flush(){
  if(!apiReady()||net.saving) return;
  const names=Object.keys(local.pending).filter(n=>Object.keys(local.pending[n]).length);
  if(!names.length){ setStatus(); return; }
  net.saving=true; setStatus();
  try{
    for(const name of names){
      const batch={...local.pending[name]};
      const votes=Object.entries(batch).map(([id,v])=>({id,v,place:(BY[id]||{}).ko||"",cat:CAT[(BY[id]||{}).cat]||""}));
      const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"vote",name,votes})});
      const j=await r.json(); if(!j.ok) throw new Error(j.error||"save failed");
      // confirmed: fold into server copy, drop from pending only if unchanged since we sent it
      const sm=server.members[name]||(server.members[name]={swipes:{}}); sm.swipes=sm.swipes||{};
      Object.entries(batch).forEach(([id,v])=>{ if(v) sm.swipes[id]=v; else delete sm.swipes[id];
        if(local.pending[name]&&local.pending[name][id]===v) delete local.pending[name][id]; });
      if(local.pending[name]&&!Object.keys(local.pending[name]).length) delete local.pending[name];
    }
    local.cache={members:server.members,extraNames:server.extraNames};
    net.lastSaved=local.lastSaved=new Date().toISOString(); net.error=""; backoff=3000; lsSet(local);
  }catch(e){
    net.error="offline"; lsSet(local); scheduleFlush(backoff); backoff=Math.min(backoff*2,60000);
  }
  net.saving=false; setStatus();
  if(pendingCount()) scheduleFlush(1500);
}
function beaconPending(){            // last-chance send when the page is closed
  if(!apiReady()||!navigator.sendBeacon) return;
  Object.entries(local.pending).forEach(([name,p])=>{ const votes=Object.entries(p).map(([id,v])=>({id,v,place:(BY[id]||{}).ko||"",cat:CAT[(BY[id]||{}).cat]||""}));
    if(votes.length) try{ navigator.sendBeacon(API_URL,new Blob([JSON.stringify({action:"vote",name,votes})],{type:"text/plain;charset=utf-8"})); }catch(e){} });
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") beaconPending(); else { fetchState().then(flush); } });
window.addEventListener("pagehide",beaconPending);
window.addEventListener("online",()=>{ flush(); fetchState(); });
setInterval(()=>{ if(document.visibilityState==="visible") fetchState(); },30000);
async function addNameRemote(n){ if(!apiReady()) return; try{ await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"addName",name:n})}); }catch(e){} }
/* Votes carried over from the old claude.ai version: #import=<base64 JSON {members:{name:{swipes}}}> */
function importFromHash(){
  const m=location.hash.match(/^#import=([A-Za-z0-9_\-+/=%]+)/); if(!m) return;
  try{
    const raw=decodeURIComponent(m[1]).replace(/-/g,"+").replace(/_/g,"/");
    const data=JSON.parse(decodeURIComponent(escape(atob(raw))));
    let n=0;
    Object.entries(data.members||{}).forEach(([name,mm])=>{ Object.entries((mm&&mm.swipes)||{}).forEach(([id,v])=>{
      if(BY[id]&&["must","maybe","skip"].includes(v)){ (local.pending[name]||(local.pending[name]={}))[id]=v; n++; } }); });
    lsSet(local); history.replaceState(null,"",location.pathname+"#swipe");
    if(n) setTimeout(()=>toast(`이전 투표 ${n}개를 가져와서 구글 시트에 저장할게요`),400);
  }catch(e){ history.replaceState(null,"",location.pathname+"#swipe"); }
}

/* ---------- ui helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
let tt; function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2200)}
function setStatus(){
  const pc=pendingCount(), ok=!net.error&&!pc&&!net.loading;
  const t=net.lastSaved?new Date(net.lastSaved).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}):"";
  $("#dot").classList.toggle("on",ok);
  $("#statusText").textContent=
    net.error==="no-api" ? "⚠️ 저장 서버 준비 중 · 지금 투표는 이 기기에만 보관돼요"
    : net.loading ? "가족 투표 불러오는 중…"
    : net.saving ? `⏳ 구글 시트에 저장 중… (${pc}개)`
    : pc&&net.error ? `⚠️ 인터넷 연결 확인 중 · ${pc}개는 이 기기에 안전하게 보관, 연결되면 자동 저장`
    : pc ? `⏳ 저장 대기 ${pc}개`
    : `✅ 모든 투표가 가족 구글 시트에 저장됨${t?` · 마지막 저장 ${t}`:""} · 창을 닫아도 안전해요`;
}
function refreshViews(){ renderWho(); const h=(location.hash||"#swipe").slice(1); if(h==="results") renderResults(); else if(h==="swipe"&&!me) renderSwipe(); }
function factsHTML(it){
  const e=EASE[it.ease];
  return `<div class="tags">
      <span class="tag">🚉 ${esc(it.st||it.area)}</span>
      <span class="tag">⏱ ${esc(it.t||"-")}</span>
      <span class="tag">${/실내|아케이드|포장/.test(it.io||"")?"🏠":"🌤"} ${esc(it.io||"-")}</span>
      <span class="tag">💴 ${esc(it.price)}</span>
      <span class="tag ${e.c}">🚶 ${e.t}</span>
      <span class="tag">${/필수/.test(it.res||"")?"📞":"🎟"} ${esc(it.res||"-")}</span>
    </div>`;
}
function detailHTML(it){
  return `<dl class="info">
      <div><dt>👀 꼭 해볼 것</dt><dd>${esc(it.see||"-")}</dd></div>
      <div><dt>🕒 언제 가면 좋아요</dt><dd>${esc(it.when||"-")}</dd></div>
      <div><dt>💡 꿀팁</dt><dd>${esc(it.tip||"-")}</dd></div>
      <div><dt>👨‍👩‍👧 가족 포인트</dt><dd>${esc(it.fam||"-")}</dd></div>
    </dl>
    <div class="links">
      <a href="${mapUrl(it)}" target="_blank" rel="noopener">📍 구글맵</a>
      <a href="${photoUrl(it)}" target="_blank" rel="noopener">📷 실제 사진 더 보기</a>
      ${it.v?(/youtube\.com/.test(it.v[1])?`<a href="${it.v[1]}" target="_blank" rel="noopener">🎥 ${esc(it.v[0])} · ▶ ${esc(it.v[2]==="0:00"?"이 장소만 다룬 영상":it.v[2]+"부터")}</a>`:`<a href="${it.v[1]}" target="_blank" rel="noopener">📝 ${esc(it.v[0])}</a>`):""}
    </div>
    <p class="fine">운영시간·가격은 방문 전 구글맵에서 다시 확인하세요 (연말연시 1/1~1/3 휴무 많음).</p>`;
}
function phHTML(it){
  const ps=photosOf(it);
  return `<div class="ph" data-ph="${it.id}">
      <div class="strip">${ps.map((p,i)=>`<img src="${esc(p.src)}" alt="${esc(it.ko)} 사진 ${i+1}" loading="${i?"lazy":"eager"}" decoding="async" referrerpolicy="no-referrer" data-zoom="${it.id}" data-zi="${i}">`).join("")}</div>
      ${it.buzz?`<span class="buzz">${esc(it.buzz)}</span>`:""}
      <span class="ex">${esc(ps[0].cap)}</span>
      ${ps.length>1?`<button class="nav prev" type="button" data-step="-1" aria-label="이전 사진">‹</button><button class="nav next" type="button" data-step="1" aria-label="다음 사진">›</button><span class="count">📷 1/${ps.length} · 밀어서 더 보기</span>`:""}
    </div>`;
}
function stepPhoto(ph,d){ const st=ph.querySelector(".strip"); st.scrollBy({left:d*st.clientWidth,behavior:"smooth"}); }
document.addEventListener("scroll",e=>{
  const st=e.target; if(!st.classList||!st.classList.contains("strip")) return;
  const ph=st.closest(".ph"), ps=photosOf(BY[ph.dataset.ph]); const i=Math.max(0,Math.min(ps.length-1,Math.round(st.scrollLeft/Math.max(1,st.clientWidth))));
  if(+ph.dataset.i===i) return; ph.dataset.i=i;
  ph.querySelector(".ex").textContent=ps[i].cap; const c=ph.querySelector(".count"); if(c) c.textContent=`📷 ${i+1}/${ps.length}`;
},true);
function galleryHTML(it){
  const ps=photosOf(it); if(ps.length<2) return "";
  return `<div class="thumbs"><b>📸 사진 ${ps.length}장 · 눌러서 크게 보기</b><div class="tgrid">${ps.map((p,i)=>`<button type="button" class="tb" data-zoom="${it.id}" data-zi="${i}"><img src="${esc(p.src)}" alt="" loading="lazy" referrerpolicy="no-referrer"></button>`).join("")}</div></div>`;
}
function cardHTML(it,{tagName="div",extra="",full=false}={}){
  return `<${tagName} class="card" ${extra}>
    ${phHTML(it)}
    <div class="bd"><h3>${esc(it.ko)}</h3><div class="en">${esc(it.en)}</div>
      <p>${esc(it.d)}</p>
      ${factsHTML(it)}
      ${full?galleryHTML(it)+detailHTML(it):`<button class="more" type="button" data-info="${it.id}">ℹ️ 자세히 보기 · 사진·메뉴·꿀팁·구글맵</button>`}
    </div></${tagName}>`;
}
/* detail sheet */
function openInfo(id){
  const it=BY[id]; if(!it) return;
  const s=$("#sheet"); $("#sheetBody").innerHTML=cardHTML(it,{full:true});
  s.hidden=false; document.body.style.overflow="hidden"; $("#sheetClose").focus();
}
function closeInfo(){ $("#sheet").hidden=true; document.body.style.overflow=""; }
let lb={id:null,i:0};
function openLB(id,i){ lb={id,i:+i||0}; $("#lbImg").referrerPolicy="no-referrer"; renderLB(); $("#lb").hidden=false; $("#lbClose").focus(); }
function renderLB(){ const it=BY[lb.id], ps=photosOf(it), p=ps[lb.i];
  $("#lbImg").src=p.src; $("#lbImg").alt=it.ko; $("#lbTitle").textContent=`${it.ko} · ${lb.i+1}/${ps.length}`;
  const lbl=p.cap.startsWith("🎥 영상 장면")?"▶ 영상에서 이 장면 보기":/youtube\.com/.test(p.href||"")?"▶ 영상 보기":"원본 사진 보기";
  $("#lbCap").innerHTML=esc(p.cap)+(p.href?` · <a href="${esc(p.href)}" target="_blank" rel="noopener">${lbl}</a>`:"");
  const d=$("#lbDots"); if(d.dataset.for!==lb.id){ d.dataset.for=lb.id; d.innerHTML=ps.map((q,k)=>`<button type="button" data-lbi="${k}" aria-label="${k+1}번째 사진"><img src="${esc(q.src)}" alt="" loading="lazy" referrerpolicy="no-referrer"></button>`).join(""); }
  d.querySelectorAll("button").forEach((b,k)=>b.classList.toggle("on",k===lb.i)); const on=d.children[lb.i]; if(on) on.scrollIntoView({block:"nearest",inline:"center"}); }
function stepLB(d){ const n=photosOf(BY[lb.id]).length; lb.i=(lb.i+d+n)%n; renderLB(); }
function closeLB(){ $("#lb").hidden=true; }
document.addEventListener("click",e=>{
  const st=e.target.closest("[data-step]"); if(st){ e.preventDefault(); e.stopPropagation(); if(st.closest("#lb")) stepLB(+st.dataset.step); else stepPhoto(st.closest(".ph"),+st.dataset.step); return; }
  const z=e.target.closest("[data-zoom]"); if(z){ e.preventDefault(); e.stopPropagation(); const ph=z.closest(".ph"); openLB(z.dataset.zoom, z.dataset.zi ?? (ph?ph.dataset.i:0)); return; }
  const dot=e.target.closest("[data-lbi]"); if(dot){ lb.i=+dot.dataset.lbi; renderLB(); return; }
  if(e.target.id==="lb"){ closeLB(); return; }
  const b=e.target.closest("[data-info]"); if(b){ e.preventDefault(); e.stopPropagation(); openInfo(b.dataset.info); return; }
  if(e.target.id==="sheet") closeInfo();
},true);
document.addEventListener("keydown",e=>{
  if(!$("#lb").hidden){ if(e.key==="Escape")closeLB(); if(e.key==="ArrowRight")stepLB(1); if(e.key==="ArrowLeft")stepLB(-1); e.stopImmediatePropagation(); return; }
  if(e.key==="Escape"&&!$("#sheet").hidden) closeInfo(); },true);
(function(){ let sx=null; const el=()=>$("#lb");
  document.addEventListener("pointerdown",e=>{ if(!el().hidden&&e.target.closest("#lbImg")) sx=e.clientX; });
  document.addEventListener("pointerup",e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50) stepLB(dx<0?1:-1); });
})();

/* ---------- who ---------- */
const AV_COLORS=["#E0412B","#2F6FDE","#1F8A5B","#B9478F","#D98A00","#6A4FC4","#0E8C93","#7A5A3A"];
function av(n){ let h=0; for(const ch of n) h=(h*31+ch.codePointAt(0))>>>0;
  const i=DEFAULT_MEMBERS.indexOf(n); const c=AV_COLORS[(i>=0?i:h)%AV_COLORS.length];
  return `<span class="ini" style="background:${c}">${esc([...n][0]||"?")}</span>`; }
let whoOpen=false;
function selectMe(n){me=n;local.me=n;lsSet(local);whoOpen=false;renderWho();route();window.scrollTo({top:0,behavior:"smooth"});toast(`${n}님 차례예요!`)}
function passPhone(){me="";local.me="";lsSet(local);whoOpen=false;renderWho();route();window.scrollTo({top:0})}
function doneCount(n){const m=allMembersData()[n];return m?ITEMS.filter(i=>m.swipes&&m.swipes[i.id]).length:0}
function votedSet(){const d=allMembersData();return new Set(Object.keys(d).filter(n=>Object.keys(d[n].swipes||{}).length))}
function renderWho(){
  const w=$("#who");
  if(!me){ w.innerHTML=""; w.hidden=true; return; }
  w.hidden=false;
  const voted=votedSet();
  w.innerHTML=`<div class="me-pill"><span class="me-av" aria-hidden="true">${av(me)}</span><span>지금 투표 중: <b>${esc(me)}</b></span>
      <button class="chip" type="button" id="switchBtn" aria-expanded="${whoOpen}">${whoOpen?"닫기 ▴":"사람 바꾸기 ▾"}</button>
      <button class="chip" type="button" id="passBtn">📱 다음 사람에게 넘기기</button></div>
    ${whoOpen?`<div class="who-list">${memberNames().map(n=>`<button class="chip" type="button" aria-pressed="${n===me}" data-name="${esc(n)}">${av(n)} ${esc(n)}${voted.has(n)?` · ${doneCount(n)}/${ITEMS.length}`:""}</button>`).join("")}<button class="chip add" type="button" id="addBtn">+ 이름 추가</button></div>`:""}`;
  $("#switchBtn").onclick=()=>{whoOpen=!whoOpen;renderWho()};
  $("#passBtn").onclick=passPhone;
  w.querySelectorAll("[data-name]").forEach(b=>b.onclick=()=>selectMe(b.dataset.name));
  const ab=$("#addBtn"); if(ab) ab.onclick=()=>{$("#addDlg").hidden=false;$("#addName").focus()};
}
$("#addCancel").onclick=()=>{$("#addDlg").hidden=true};
$("#addOk").onclick=()=>{const v=$("#addName").value.trim();if(!v)return;if(!local.extra.includes(v))local.extra.push(v);lsSet(local);addNameRemote(v);$("#addName").value="";$("#addDlg").hidden=true;selectMe(v)};
$("#addName").addEventListener("keydown",e=>{if(e.key==="Enter")$("#addOk").click()});
function needMe(){
  if(me) return false;
  const voted=votedSet();
  $("#main").innerHTML=`<section class="panel picker">
    <h2>누가 투표하나요?</h2>
    <p class="hint">내 이름을 누르면 바로 시작해요. 휴대폰을 넘길 때마다 이름을 다시 골라주세요. ✓ 표시는 이미 투표한 사람이에요.</p>
    <div class="pick-grid">${memberNames().map(n=>`<button type="button" class="who-big" data-pick="${esc(n)}"><span class="big-av" aria-hidden="true">${av(n)}</span><span class="big-nm">${esc(n)}</span>${voted.has(n)?`<span class="done">${doneCount(n)>=ITEMS.length?"✓ 완료":`진행 중 ${doneCount(n)}/${ITEMS.length}`}</span>`:'<span class="done todo">아직 시작 전</span>'}</button>`).join("")}
      <button type="button" class="who-big add" id="addBig"><span class="big-av" aria-hidden="true">➕</span><span class="big-nm">다른 이름</span></button></div>
  </section>`;
  $("#main").querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>selectMe(b.dataset.pick));
  $("#addBig").onclick=()=>{$("#addDlg").hidden=false;$("#addName").focus()};
  return true;
}

/* ---------- swipe ---------- */
function renderSwipe(){
  if(needMe()) return;
  const mem=getMember(me);
  const pool=ITEMS.filter(i=>swipeCat==="all"||i.cat===swipeCat);
  const left=pool.filter(i=>!mem.swipes[i.id]);
  const m=$("#main");
  const seg=`<div class="seg">${[["all","전체"],["food","🍜 먹거리"],["cafe","☕ 카페·디저트"],["sights","⛩️ 명소"]].map(([k,t])=>`<button type="button" data-s="${k}" aria-pressed="${swipeCat===k}">${t}</button>`).join("")}</div>`;
  const doneN=pool.length-left.length;
  if(!left.length){
    m.innerHTML=`<section class="panel">${seg}<p class="hint"><b>${esc(me)}</b>님은 ${pool.length}곳을 모두 골랐어요! 🎉</p>
      <div class="btnrow" style="justify-content:flex-start"><a class="btn" href="#results" style="text-decoration:none">📊 가족 결과 보기</a>
      <button class="btn ghost" type="button" onclick="passPhone()">📱 다음 사람에게 넘기기</button>
      <button class="btn ghost" type="button" id="redo">처음부터 다시 고르기</button></div></section>`;
    $("#redo").onclick=()=>{const mm=getMember(me);pool.forEach(i=>delete mm.swipes[i.id]);saveMember(me,mm);renderSwipe()};
  } else {
    const it=left[0];
    m.innerHTML=`<section class="panel">${seg}
      <div class="round"><span class="r" style="font-size:18px">${esc(me)} · ${doneN+1}/${pool.length}</span><div class="bar"><i style="width:${Math.round(doneN/pool.length*100)}%"></i></div></div>
      <div class="stack">${cardHTML(it,{extra:'id="swcard"',full:true})}
        <div class="vote3">
          <button class="v-skip" type="button" data-v="skip">패스<small>← 왼쪽으로 밀기</small></button>
          <button class="v-maybe" type="button" data-v="maybe">고민 중<small>↑ 위로</small></button>
          <button class="v-must" type="button" data-v="must">꼭 가기<small>오른쪽으로 →</small></button>
        </div></div></section>`;
    m.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>voteSwipe(it.id,b.dataset.v));
    attachDrag($("#swcard"),it.id);
  }
  m.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{swipeCat=b.dataset.s;renderSwipe()});
}
function voteSwipe(id,v){
  const card=$("#swcard");
  const mem=getMember(me); mem.swipes[id]=v; saveMember(me,mem);
  if(card&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    card.classList.add("fly");
    card.style.transform=v==="must"?"translateX(120%) rotate(12deg)":v==="skip"?"translateX(-120%) rotate(-12deg)":"translateY(-60%)";
    card.style.opacity="0"; setTimeout(renderSwipe,260);
  } else renderSwipe();
}
function attachDrag(el,id){
  if(!el) return; let sx=0,sy=0,dx=0,dy=0,down=false;
  el.addEventListener("pointerdown",e=>{if(e.target.closest("a,button,.ph"))return;down=true;sx=e.clientX;sy=e.clientY;el.classList.add("drag");el.setPointerCapture(e.pointerId)});
  el.addEventListener("pointermove",e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;el.style.transform=`translate(${dx}px,${Math.min(dy,0)}px) rotate(${dx/25}deg)`});
  const end=()=>{if(!down)return;down=false;el.classList.remove("drag");
    if(dx>90) voteSwipe(id,"must"); else if(dx<-90) voteSwipe(id,"skip"); else if(dy<-90) voteSwipe(id,"maybe"); else el.style.transform="";dx=dy=0};
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
}

/* ---------- results ---------- */
function scores(){
  const data=allMembersData(); const sc={};
  ITEMS.forEach(i=>sc[i.id]={pts:0,must:[],maybe:[],skip:[]});
  Object.entries(data).forEach(([name,m])=>{
    Object.entries(m.swipes||{}).forEach(([id,v])=>{ if(!sc[id])return; sc[id].pts+=SWIPE_PTS[v]||0; sc[id][v]?.push(name); });
  });
  return {sc,data};
}
let resOpen={};
function renderResults(){
  const {sc,data}=scores(); const voters=Object.keys(data).filter(n=>Object.keys(data[n].swipes||{}).length);
  const list=cat=>ITEMS.filter(i=>i.cat===cat).map(i=>({it:i,...sc[i.id]})).sort((a,b)=>b.pts-a.pts);
  const max=Math.max(1,...ITEMS.map(i=>sc[i.id].pts));
  const row=(r,k)=>`<div class="rank"><span class="n">${k+1}</span><img src="img/${r.it.id}.jpg" alt=""><div><button class="nm linkish" type="button" data-info="${r.it.id}">${esc(r.it.ko)}</button>
      <div class="who2">${r.must.length?`꼭: ${esc(r.must.join(", "))}`:""}${r.maybe.length?`${r.must.length?" · ":""}고민: ${esc(r.maybe.join(", "))}`:""}${r.skip.length?`${(r.must.length||r.maybe.length)?" · ":""}패스: ${esc(r.skip.join(", "))}`:""}${(!r.must.length&&!r.maybe.length&&!r.skip.length)?"아직 표 없음":""}</div>
      <div class="meter"><i style="width:${Math.max(0,Math.round(r.pts/max*100))}%"></i></div></div><span class="sc">${r.pts}점</span></div>`;
  $("#main").innerHTML=`<section class="panel">
    <section class="progress"><h2>📈 진행 상황 <span class="legend">한 장 고를 때마다 바로 반영돼요 · 끝까지 안 해도 점수에 들어가요</span></h2>
      <div class="prog-grid">${memberNames().map(n=>{const m=data[n]||{swipes:{}};const s=ITEMS.map(i=>m.swipes[i.id]).filter(Boolean);const pct=Math.round(s.length/ITEMS.length*100);
        return `<div class="prog"><span class="pn">${av(n)} <b>${esc(n)}</b></span><span class="pst">${s.length===0?"아직 시작 전":s.length>=ITEMS.length?"✓ 완료":`진행 중 · ${s.length}/${ITEMS.length}`}</span>
          <div class="pbar"><i style="width:${pct}%"></i></div>
          <span class="pmix">꼭 ${s.filter(v=>v==="must").length} · 고민 ${s.filter(v=>v==="maybe").length} · 패스 ${s.filter(v=>v==="skip").length}</span></div>`}).join("")}</div></section>
    <div class="podium">
      ${[["food","🍜 먹거리"],["cafe","☕ 카페·디저트"],["sights","⛩️ 명소"]].map(([c,t])=>{const L=list(c);const open=resOpen[c];return `<section><h2>${t} 순위 <span class="legend">(${L.length}곳)</span></h2>${L.slice(0,open?L.length:10).map(row).join("")}${L.length>10?`<button class="more" type="button" data-more="${c}">${open?"접기 ▴":`전체 ${L.length}곳 보기 ▾`}</button>`:""}</section>`}).join("")}
    </div>
    <p class="legend">점수: 꼭 가기 +3 · 고민 중 +1 · 패스 −1</p>
    <div class="btnrow" style="justify-content:flex-start"><button class="btn" type="button" id="copyRes">카톡에 붙여넣을 결과 복사</button></div>
  </section>`;
  $("#main").querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{resOpen[b.dataset.more]=!resOpen[b.dataset.more];renderResults()});
  $("#copyRes").onclick=async()=>{
    const t=`[오사카 가족 투표 결과]\n🍜 먹거리 TOP5\n${list("food").slice(0,5).map((r,k)=>`${k+1}. ${r.it.ko} (${r.pts}점)`).join("\n")}\n☕ 카페·디저트 TOP3\n${list("cafe").slice(0,3).map((r,k)=>`${k+1}. ${r.it.ko} (${r.pts}점)`).join("\n")}\n⛩️ 명소 TOP5\n${list("sights").slice(0,5).map((r,k)=>`${k+1}. ${r.it.ko} (${r.pts}점)`).join("\n")}`;
    try{await navigator.clipboard.writeText(t);toast("복사했어요! 카톡에 붙여넣기 하세요")}catch(e){toast("복사가 막혀 있어요. 화면을 캡처해 공유해주세요")}
  };
}
function renderCredits(){
  $("#main").innerHTML=`<section class="panel"><p class="hint">카드마다 사진을 옆으로 밀어서 볼 수 있어요. 첫 사진은 위키미디어 공용 사진('예시 사진'은 같은 음식의 다른 가게), 🎥 영상 장면은 그 장소가 나오는 브이로그의 해당 시점, 🎥 썸네일은 그 장소를 다룬 유튜브 영상, 📷 위키미디어는 추가 자유 이용 사진이에요. 크게 보기에서 캡션을 누르면 원본 영상·사진으로 이동해요. 아래는 카드 첫 사진의 출처입니다.</p>
  <ol class="credits">${ITEMS.map(i=>{const c=CREDITS[i.id];return `<li>${esc(i.ko)} — <a href="${c.u}" target="_blank" rel="noopener">${esc(c.a)}</a>, ${esc(c.l)}</li>`}).join("")}</ol></section>`;
}

/* ---------- routing ---------- */
const VIEWS={swipe:renderSwipe,results:renderResults,credits:renderCredits};
function route(){
  const h=(location.hash||"#swipe").slice(1); const v=VIEWS[h]?h:"swipe";
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===v?"page":"false"));
  VIEWS[v]();
}
window.addEventListener("hashchange",route);
document.addEventListener("keydown",e=>{
  if(e.target.matches("input"))return;
  const h=(location.hash||"#swipe").slice(1);
  if(h==="swipe"&&$("#swcard")){ const id=ITEMS.filter(i=>(swipeCat==="all"||i.cat===swipeCat)&&!getMember(me).swipes[i.id])[0]?.id; if(!id)return;
    if(e.key==="ArrowRight")voteSwipe(id,"must"); if(e.key==="ArrowLeft")voteSwipe(id,"skip"); if(e.key==="ArrowUp")voteSwipe(id,"maybe"); }
});
importFromHash(); renderWho(); setStatus(); route();
fetchState().then(flush);
</script>
</body>
